name: Deploy Azure Static Web Apps Free
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: azure-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true
      - name: Verify deployed application
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors https://gray-river-0a0236110.5.azurestaticapps.net -o "$RUNNER_TEMP/azure-smoke"
          grep -Fq 'Env Reaper' "$RUNNER_TEMP/azure-smoke"
